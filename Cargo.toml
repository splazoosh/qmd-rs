[workspace]
resolver = "3"
members = ["crates/qmd-archive", "crates/qmd-cli", "crates/qmd-mcp", "crates/qmd"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/splazoosh/qmd-rs"

[workspace.lints.clippy.correctness]
level = "deny"
priority = -1

[workspace.lints.clippy.suspicious]
level = "warn"
priority = -1

[workspace.lints.clippy.style]
level = "warn"
priority = -1

[workspace.lints.clippy.complexity]
level = "warn"
priority = -1

[workspace.lints.clippy.perf]
level = "warn"
priority = -1

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
