[package]
name = "qmd-mcp"
description = "stdio MCP server over a qmd index"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[dependencies]
anyhow = "1"
schemars = "1"
serde_json = "1"
tokio-util = "0.7"

[dependencies.axum]
version = "0.8"
default-features = false
features = ["http1", "tokio", "json", "query"]

[dependencies.qmd]
path = "../qmd"

[dependencies.rmcp]
version = "3.1.4"
features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "sync", "io-std", "net", "signal", "time"]

[dev-dependencies]
tempfile = "3"

[dev-dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json"]

[dev-dependencies.rmcp]
version = "3.1.4"
features = ["server", "client", "macros", "schemars", "transport-io", "transport-async-rw", "transport-streamable-http-client-reqwest"]

[lints]
workspace = true
