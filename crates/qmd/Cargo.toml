[package]
name = "qmd"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[features]
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs"]
cuda = ["llama", "llama-cpp-2/cuda"]

[dependencies]
ureq = "3"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
regex = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlite-vec = "0.1"
thiserror = "2"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock"]

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.llama-cpp-2]
version = "=0.1.153"
optional = true

[dependencies.llama-cpp-sys-2]
version = "=0.1.153"
optional = true

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dependencies.rusqlite]
version = "0.37"
features = ["bundled", "functions", "vtab"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
